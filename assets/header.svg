<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Srinivas Vengaldas, Software Engineer">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8860b"/>
      <stop offset="0.5" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#fff3a3"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd700" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="nameClip">
      <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="1">Srinivas Vengaldas</text>
    </clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffd700" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .wave { animation: drift 9s ease-in-out infinite alternate; }
      .wave2 { animation: drift 12s ease-in-out infinite alternate-reverse; }
      .sweep { animation: sweep 4.5s ease-in-out infinite; }
      .fade { opacity: 0; animation: fadeIn 1.2s ease-out forwards; }
      .fade.d1 { animation-delay: 0.2s; }
      .fade.d2 { animation-delay: 0.7s; }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      .cube { transform-origin: 1080px 70px; animation: spin 14s linear infinite; }
      @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
      @keyframes sweep { 0% { transform: translateX(-700px); } 60%, 100% { transform: translateX(700px); } }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect width="1200" height="300" fill="#050505"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- waves -->
  <g class="wave2" opacity="0.35">
    <path d="M-100 250 C 150 200, 350 290, 600 245 S 1050 200, 1300 250 V 300 H -100 Z" fill="#3a2f00"/>
  </g>
  <g class="wave" opacity="0.9">
    <path d="M-100 270 C 200 235, 400 300, 650 265 S 1100 235, 1300 272 V 300 H -100 Z" fill="url(#gold)" opacity="0.55"/>
    <path d="M-100 270 C 200 235, 400 300, 650 265 S 1100 235, 1300 272" fill="none" stroke="#ffd700" stroke-width="2"/>
  </g>

  <!-- spinning wireframe cube, a nod to the portfolio -->
  <g class="cube" fill="none" stroke="#ffd700" stroke-opacity="0.55" stroke-width="1.5">
    <rect x="1055" y="45" width="50" height="50"/>
    <rect x="1067" y="33" width="50" height="50"/>
    <path d="M1055 45 L1067 33 M1105 45 L1117 33 M1105 95 L1117 83 M1055 95 L1067 83"/>
  </g>

  <!-- data points -->
  <g fill="#ffd700">
    <circle class="dot" cx="120" cy="70" r="3"/>
    <circle class="dot" cx="180" cy="110" r="2" style="animation-delay:.6s"/>
    <circle class="dot" cx="95" cy="140" r="2.5" style="animation-delay:1.2s"/>
    <circle class="dot" cx="980" cy="160" r="2" style="animation-delay:.9s"/>
    <circle class="dot" cx="1140" cy="140" r="3" style="animation-delay:1.5s"/>
  </g>

  <!-- name with a moving shine -->
  <g class="fade d1">
    <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="1" fill="url(#gold)">Srinivas Vengaldas</text>
    <g clip-path="url(#nameClip)">
      <rect class="sweep" x="300" y="60" width="160" height="110" fill="url(#shine)"/>
    </g>
  </g>

  <g class="fade d2" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="196" font-size="22" fill="#e5e5e5" letter-spacing="4">SOFTWARE ENGINEER · DATA &amp; ML SYSTEMS</text>
    <text x="600" y="226" font-size="15" fill="#a3a3a3" letter-spacing="2">WASHINGTON, DC · GWU M.S. DEC 2026</text>
  </g>
</svg>
